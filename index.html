        function pruefMerken(begriff, nebenform) {
            if (!pruefBekannt) return;
            [begriff, nebenform].forEach(function(w) {
                if (!w) return;
                String(w).split(/[,;/\s]+/).forEach(function(t) {
                    t = t.trim().toLowerCase();
                    if (!t) return;
                    pruefBekannt.add(t);
                    if (pruefIndex && t.length >= 3) (pruefIndex[t.length] = pruefIndex[t.length] || []).push(t);
                    if (pruefKanonMap && t.length >= 3 && !pruefKanonMap[pruefKanon(t)]) pruefKanonMap[pruefKanon(t)] = t;
                });
            });
        }

        /* ═══════════ WERKSTATT (Übersetzungs-Werkbank) ═══════════ */

        var WK_SPRACHEN = ['Deutsch','Englisch','Französisch','Italienisch','Spanisch','Niederländisch',

        function renderWerkstatt() {

            else

            h += '</div>';

            h += '<div class="wz-row">';

            // --- Überarbeiten ---
            h += '<div class="wz-box"><h3>✍️ Übersetzung überarbeiten</h3>';
            h += '<p class="wz-muted" style="margin-bottom:8px;">Wirkt auf die <b>markierte Stelle</b> im rechten Feld – ohne Markierung auf den ganzen Text.</p>';
            h += '<div class="wz-row" style="margin:0 0 10px;">';
            WK_UEBERARBEITEN.forEach(function(a) {
                h += '<button class="wz-mini grau" onclick="wkUeberarbeiten(\'' + a[0] + '\')"' + (kiBereit() ? '' : ' disabled') + '>' + a[1] + '</button>';

                h += '<div style="margin-top:12px;"><label class="wz-muted">Vorschlag</label>';

                h += '<button class="wz-mini grau" onclick="state.wkVorschlag=null;render();">✕ Verwerfen</button>';

        function wkQuelleHtml(txt) {
            var teile = String(txt).split(/([A-Za-zÄÖÜäöüßÀ-ÿ']+)/);
            var out = '';
            teile.forEach(function(t) {
                if (/^[A-Za-zÄÖÜäöüßÀ-ÿ']+$/.test(t) && t.length > 1)
                    out += '<span class="wk-w" data-w="' + escHtml(t) + '">' + escHtml(t) + '</span>';
                else out += escHtml(t);
            });
            return out;
        }

        function wkQuelleUebernehmen() {
            var ta = document.getElementById('wk-quelle-ta');
            if (ta) state.wkQuelle = ta.value;
            var z = document.getElementById('wk-ziel'); if (z) state.wkZiel = z.value;
            wkSpracheLesen();
            render();
        }

        function wkSpracheLesen() {
            var frei = document.getElementById('wk-sprache-frei');
            if (frei && frei.value.trim()) { state.wkSprache = frei.value.trim(); return; }
            var s = document.getElementById('wk-sprache'); if (s) state.wkSprache = s.value;
        }

        function wkTextLaden() {
            var inp = document.getElementById('wk-datei');
            if (!inp) return;
            inp.onchange = function(e) {
                var f = e.target.files && e.target.files[0];
                if (!f) return;
                var r = new FileReader();
                r.onload = function(ev) { state.wkQuelle = String(ev.target.result || ''); render(); showToast('Datei geladen', 'success'); };
                r.readAsText(f);
            };
            inp.click();
        }

        function wkLeeren() {
            if (!confirm('Beide Felder leeren?')) return;
            state.wkQuelle = ''; state.wkZiel = ''; state.wkVorschlag = null; wkPopZu(); render();
        }

        function wkZielKopieren() {
            var z = document.getElementById('wk-ziel');
            var t = z ? z.value : (state.wkZiel || '');
            if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ showToast('Übersetzung kopiert', 'success'); });
        }

        function wkZielPruefen() {
            var z = document.getElementById('wk-ziel');
            state.wkZiel = z ? z.value : state.wkZiel;
            if (!state.wkZiel || !state.wkZiel.trim()) { showToast('Noch keine Übersetzung', 'warning'); return; }
            state.pruefText = state.wkZiel;
            state.adminTab = 'pruefen';
            render();
            setTimeout(pruefText, 60);
        }

        /* --- Rechtsklick: sinngemässe Entsprechungen --- */
        function wkKontext(ev) {
            var el = ev.target;
            if (!el || !el.classList || !el.classList.contains('wk-w')) return true;
            ev.preventDefault();
            wkPopZeigen(ev.clientX, ev.clientY, el.getAttribute('data-w') || '');
            return false;
        }

        function wkPopZu() { var p = document.getElementById('wk-pop'); if (p) p.remove(); }
        function wkPopZuEinmal() { wkPopZu(); document.removeEventListener('click', wkPopZuEinmal); }

        function wkPopSetzen(html) { var p = document.getElementById('wk-pop'); if (p) p.innerHTML = html; }

        function wkPopZeigen(x, y, wort) {
            wkPopZu();
            var d = document.createElement('div');
            d.className = 'wk-pop'; d.id = 'wk-pop';
            d.style.left = Math.min(x, window.innerWidth - 340) + 'px';
            d.style.top = Math.min(y, window.innerHeight - 340) + 'px';
            d.innerHTML = '<h4>« ' + escHtml(wort) + ' »</h4><div class="wz-muted">suche…</div>';
            document.body.appendChild(d);
            setTimeout(function() { document.addEventListener('click', wkPopZuEinmal); }, 10);

            var istDeutsch = (state.wkSprache === 'Deutsch');
            if (istDeutsch) {
                wkWoerterbuchSuche([wort], wort, null);
            } else if (kiBereit()) {
                wkPopSetzen('<h4>« ' + escHtml(wort) + ' »</h4><div class="wz-muted">' + escHtml(state.wkSprache) + ' → Bedeutung wird ermittelt…</div>');
                var sys = 'Du bist Übersetzer und kennst Schweizer Mundart. '
                    + 'Für das vorgelegte Wort aus dem ' + state.wkSprache + ' lieferst du die BEDEUTUNG, nicht eine wörtliche Übertragung. '
                    + 'Antworte ausschliesslich als JSON: {"deutsch":["…","…"],"mundart":["…","…"]} '
                    + 'wobei "deutsch" 2–4 hochdeutsche Entsprechungen enthält und "mundart" 2–5 sinngemässe Schweizer Mundart-Wörter '
                    + 'in schriftnaher Schreibweise (ii statt y, kein ß, kein Apostroph).';
                kiFrage(sys, state.wkSprache + ': ' + wort, 400, false).then(function(a) {
                    var o = kiJson(a) || {};
                    var deutsch = o.deutsch || [];
                    var mundart = o.mundart || [];
                    if (!deutsch.length && !mundart.length) { wkPopSetzen('<h4>« ' + escHtml(wort) + ' »</h4><div class="wz-muted">Nichts gefunden.</div>'); return; }
                    wkWoerterbuchSuche(deutsch, wort, mundart);
                }).catch(function(e) {
                    wkPopSetzen('<h4>« ' + escHtml(wort) + ' »</h4><div class="wz-muted">' + escHtml(e.message) + '</div>');
                });
            } else {
                wkPopSetzen('<h4>« ' + escHtml(wort) + ' »</h4><div class="wz-muted">Für ' + escHtml(state.wkSprache)
                    + ' braucht es den API-Schlüssel (Reiter KI), damit die Bedeutung bestimmt werden kann.</div>');
            }
        }

        // Sucht im Wörterbuch nach allen deutschen Begriffen und zeigt das Ergebnis
        function wkWoerterbuchSuche(deutscheWoerter, original, kiMundart) {
            var anfragen = [];
            deutscheWoerter.slice(0, 4).forEach(function(d) {
                var q = encodeURIComponent(String(d).trim());
                if (!q) return;
                anfragen.push(supabaseCall('woerter?select=begriff,wortart,synonyme,bedeutung,nebenform&synonyme=ilike.*' + q + '*&limit=10&order=begriff.asc'));
                anfragen.push(supabaseCall('woerter?select=begriff,wortart,synonyme,bedeutung,nebenform&begriff=ilike.' + q + '&limit=3'));
            });
            if (!anfragen.length) { wkZeigeTreffer([], original, kiMundart, deutscheWoerter); return; }
            Promise.all(anfragen).then(function(res) {
                var alle = [];
                res.forEach(function(r) { (r || []).forEach(function(w) { alle.push(w); }); });
                var seen = {}, liste = [];
                alle.forEach(function(w) { var k = w.begriff.toLowerCase(); if (!seen[k]) { seen[k] = 1; liste.push(w); } });
                liste.sort(function(a, b) { return wkRang(b, deutscheWoerter) - wkRang(a, deutscheWoerter); });
                wkZeigeTreffer(liste, original, kiMundart, deutscheWoerter);
            }).catch(function(e) {
                wkPopSetzen('<h4>« ' + escHtml(original) + ' »</h4><div class="wz-muted">Fehler: ' + escHtml(e.message) + '</div>');
            });
        }

        function wkZeigeTreffer(liste, original, kiMundart, deutscheWoerter) {
            var h = '<h4>« ' + escHtml(original) + ' »</h4>';
            if (deutscheWoerter && deutscheWoerter.length && state.wkSprache !== 'Deutsch')
                h += '<div class="wz-muted" style="margin-bottom:8px;">Bedeutung: ' + escHtml(deutscheWoerter.join(', ')) + '</div>';

            if (liste.length) {
                h += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">Aus dem Wörterbuch</div>';
                liste.slice(0, 10).forEach(function(w) {
                    h += '<div class="wk-tref" onclick="wkEinfuegen(\'' + escAttr(w.begriff) + '\')">';
                    h += '<b>' + escHtml(w.begriff) + '</b>' + (wkRang(w, deutscheWoerter) >= 2 ? ' <span style="color:var(--accent-color);">★</span>' : '');
                    if (w.wortart) h += ' <small style="display:inline;">' + escHtml(w.wortart) + '</small>';
                    if (w.nebenform) h += '<small>Partizip / Mehrzahl: ' + escHtml(w.nebenform) + '</small>';
                    if (w.bedeutung) h += '<small>' + escHtml(String(w.bedeutung).slice(0, 90)) + '</small>';
                    h += '</div>';
                });
            } else {
                h += '<div class="wz-muted">Nichts im Wörterbuch.</div>';
            }

            if (kiMundart && kiMundart.length) {
                h += '<div style="font-size:12px;color:var(--text-muted);margin:10px 0 4px;">Vorschläge der KI</div>';
                kiMundart.forEach(function(w) {
                    var s = String(w);
                    h += '<div class="wk-tref" onclick="wkEinfuegen(\'' + escAttr(s) + '\')">' + escHtml(s) + '</div>';
                });
            }
            if (kiBereit()) {
                h += '<div class="wz-row" style="margin-top:10px;">';
                h += '<button class="wz-mini grau" onclick="wkKiVorschlag(\'' + escAttr(original) + '\')">🤖 Mehr Vorschläge</button>';
                h += '<button class="wz-mini" onclick="wkBesprechen(\'' + escAttr(original) + '\')">💬 Besprechen</button>';
                h += '</div>';
            }
            wkPopSetzen(h);
        }

        function wkRang(w, suchListe) {
            var syn = String(w.synonyme || '').toLowerCase().split(',').map(function(x) { return x.trim(); });
            var beg = String(w.begriff).toLowerCase();
            var rang = 1;
            (suchListe || []).forEach(function(s) {
                var ss = String(s).toLowerCase().trim();
                if (beg === ss) rang = Math.max(rang, 3);
                else if (syn.length && syn[0] === ss) rang = Math.max(rang, 2);
            });
            return rang;
        }

        function escAttr(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

        function wkEinfuegen(wort) {
            var z = document.getElementById('wk-ziel');
            if (!z) return;
            var p = z.selectionStart != null ? z.selectionStart : z.value.length;
            z.value = z.value.slice(0, p) + wort + z.value.slice(p);
            state.wkZiel = z.value;
            z.focus(); z.selectionStart = z.selectionEnd = p + wort.length;
            wkPopZu();
        }

        function wkKiVorschlag(wort) {
            if (!kiBereit()) { showToast('Kein API-Schlüssel', 'error'); return; }
            wkPopSetzen('<h4>« ' + escHtml(wort) + ' »</h4><div class="wz-muted">KI denkt nach…</div>');
            var sys = kiRegelPrompt() + '\n\\nAUFGABE: Nenne für das vorgelegte Wort 3–6 sinngemässe Schweizer Mundart-Entsprechungen '
                    + 'in unserer Schreibweise. Antworte nur als Liste «Wort – knappe Erklärung», ohne Vorrede.';
            kiFrage(sys, state.wkSprache + ': ' + wort, 400, false).then(function(a) {
                var zeilen = String(a).split('\n').filter(function(z) { return z.trim(); });
                var h = '<h4>« ' + escHtml(wort) + ' » – KI</h4>';
                zeilen.slice(0, 8).forEach(function(z) {
                    var rein = z.replace(/^[-*\\d.\\s]+/, '');
                    var w = rein.split(/[–—-]/)[0].trim();
                    h += '<div class="wk-tref" onclick="wkEinfuegen(\'' + escAttr(w) + '\')">' + escHtml(rein) + '</div>';
                });
                wkPopSetzen(h);
            }).catch(function(e) { wkPopSetzen('<div class="wz-muted">' + escHtml(e.message) + '</div>'); });
        }

        /* --- KI übersetzt --- */
        function wkUebersetzen(nurAuswahl) {
            if (!kiBereit()) { showToast('Kein API-Schlüssel', 'error'); return; }
            var q = state.wkQuelle;
            var ta = document.getElementById('wk-quelle-ta'); if (ta && ta.value) q = ta.value;
            if (typeof nurAuswahl === 'string' && nurAuswahl) q = nurAuswahl;
            if (!q || !q.trim()) { showToast('Kein Quelltext', 'warning'); return; }
            var z = document.getElementById('wk-ziel'); if (z) state.wkZiel = z.value;
            wkSpracheLesen();
            state.kiLaeuft = true; render();
            var sys = kiRegelPrompt()
              + '\n\\nAUFGABE: Übersetze den Text aus dem ' + state.wkSprache + ' in Schweizer Mundart, streng nach den obigen Schreibregeln.\n'
              + '- SINNGEMÄSS übersetzen, nicht Wort für Wort. Gesprochene Mundart, keine Schriftsprache.\n'
              + '- Lange Schachtelsätze in mehrere kurze, sprechbare Sätze zerlegen. Der Inhalt bleibt vollständig.\n'
              + '- Partizipial- und Genitivkonstruktionen auflösen, die es in der gesprochenen Mundart nicht gibt.\n'
              + '- Theatertexte: Sprechernamen und hochdeutsche Regieanweisungen bleiben UNVERÄNDERT stehen.\n'
              + '- Zeilenumbrüche und Aufbau bewahren.\n'
              + '- Antworte NUR mit der Übersetzung, ohne Vorrede und ohne Erklärungen.';
            kiFrage(sys, q, 4000, false).then(function(a) {
                state.kiLaeuft = false;
                var vorher = state.wkZiel || '';
                state.wkZiel = (typeof nurAuswahl === 'string' && nurAuswahl && vorher) ? (vorher + '\n' + a) : a;
                render();
                showToast('✓ Übersetzung eingefügt – bitte prüfen', 'success');
            }).catch(function(e) { state.kiLaeuft = false; render(); showToast(e.message, 'error'); });
        }

        function wkAbschnitt() {
            var sel = window.getSelection ? String(window.getSelection()) : '';
            if (!sel.trim()) { showToast('Nichts markiert', 'warning'); return; }
            wkUebersetzen(sel);
        }

        /* --- Übersetzung überarbeiten --- */
        function wkAuswahlOderAlles() {
            var z = document.getElementById('wk-ziel');
            if (!z) return { text: state.wkZiel || '', teil: false, von: 0, bis: 0 };
            state.wkZiel = z.value;
            var a = z.selectionStart, b = z.selectionEnd;
            if (a != null && b != null && b > a) return { text: z.value.slice(a, b), teil: true, von: a, bis: b };
            return { text: z.value, teil: false, von: 0, bis: z.value.length };
        }

        function wkUeberarbeiten(art) {
            if (!kiBereit()) { showToast('Kein API-Schlüssel', 'error'); return; }
            var sel = wkAuswahlOderAlles();
            if (!sel.text.trim()) { showToast('Kein Text zum Überarbeiten', 'warning'); return; }
            var auftrag = '';
            if (art === 'frei') {
                var el = document.getElementById('wk-auftrag');
                auftrag = el ? el.value.trim() : '';
                if (!auftrag) { showToast('Bitte einen Auftrag eingeben', 'warning'); return; }
            } else {
                WK_UEBERARBEITEN.forEach(function(a) { if (a[0] === art) auftrag = a[2]; });
            }
            state.wkBereich = sel;
            state.kiLaeuft = true; state.wkVorschlag = null; render();
            var nurListe = (art === 'wendung');
            var sys = kiRegelPrompt() + '\n\\nAUFGABE: ' + auftrag + '\n'
              + (nurListe ? '' : '- Antworte NUR mit dem überarbeiteten Text, ohne Vorrede und ohne Erklärungen.\n')
              + '- Sprechernamen und hochdeutsche Regieanweisungen bleiben unverändert.\n'
              + '- Halte dich an die Schreibregeln.';
            kiFrage(sys, sel.text, 4000, false).then(function(a) {
                state.kiLaeuft = false; state.wkVorschlag = a; render();
            }).catch(function(e) { state.kiLaeuft = false; render(); showToast(e.message, 'error'); });
        }

        function wkVorschlagUebernehmen() {
            var v = state.wkVorschlag, b = state.wkBereich;
            if (!v) return;
            var neu = String(v).replace(/^```[a-z]*\\n?|```$/g, '').trim();
            var z = document.getElementById('wk-ziel');
            var ganz = z ? z.value : (state.wkZiel || '');
            if (b && b.teil) state.wkZiel = ganz.slice(0, b.von) + neu + ganz.slice(b.bis);
            else state.wkZiel = neu;
            state.wkVorschlag = null; state.wkBereich = null;
            render();
            showToast('✓ Übernommen', 'success');
        }

        function wkVorschlagKopieren() {
            var t = state.wkVorschlag || '';
            if (navigator.clipboard) navigator.clipboard.writeText(t).then(function() { showToast('Vorschlag kopiert', 'success'); });
        }

        function renderExportTab() {
            var h = '<div class="wz-wrap">';
            h += '<div class="wz-box"><h3>➕ Neues Wort</h3>'
               + '<p class="wz-muted" style="margin-bottom:8px;">Direkt ins Wörterbuch aufnehmen – auf Wunsch mit KI-Unterstützung.</p>'
               + '<button class="btn" onclick="adminNeuerEintrag()">Neues Wort erfassen</button></div>';

            h += '</div>';

        /* ═══════════ Konsistenzprüfung des Wörterbuchs ═══════════ */
        function konsistenzPruefen() {
            var out = document.getElementById('konsi-out');
            if (out) out.innerHTML = '<div class="loading" style="padding:14px;"><div class="spinner"></div></div>';
            var alle = [], pageSize = 1000, offset = 0;
            function batch() {
                return supabaseCall('woerter?select=id,begriff,beispielsatz&limit=' + pageSize + '&offset=' + offset).then(function(d) {
                    if (d && d.length) { alle = alle.concat(d); offset += pageSize; if (d.length === pageSize) return batch(); }
                    return alle;
                });
            }
            batch().then(function(rows) {
                var treffer = [];
                rows.forEach(function(r) {
                    ['begriff','beispielsatz'].forEach(function(feld) {
                        var v = r[feld]; if (!v) return;
                        String(v).split(/[^A-Za-zÄÖÜäöüßé'’´`-]+/).forEach(function(w) {
                            if (!w || w.length < 2) return;
                            var f = regelPruefeWort(w);
                            f.forEach(function(x) {
                                if (x.art === 'hinweis') return;   // zu viele Fehlalarme
                                treffer.push({ id: r.id, begriff: r.begriff, feld: feld, wort: w, regel: x.regel, vorschlag: x.vorschlag });
                            });
                        });
                    });
                });
                if (!out) return;
                if (!treffer.length) { out.innerHTML = '<p style="color:#2f7d32;">✓ Keine Regelverstösse gefunden (' + rows.length + ' Einträge geprüft).</p>'; return; }
                var h = '<p><b>' + treffer.length + ' Fundstellen</b> in ' + rows.length + ' Einträgen:</p><div class="wz-liste">';
                treffer.slice(0, 300).forEach(function(t) {
                    h += '<div class="wz-item"><span class="wz-item-w">' + escHtml(t.wort) + '</span>'
                       + '<span class="wz-badge wz-b-f">' + escHtml(t.regel) + '</span>'
                       + '<span class="wz-item-m">in «' + escHtml(t.begriff) + '» (' + t.feld + ')'
                       + (t.vorschlag ? ' → <b>' + escHtml(t.vorschlag) + '</b>' : '') + '</span>'
                       + '<button class="wz-mini grau" onclick="showWordDetailById(' + t.id + ')">öffnen</button></div>';
                });
                h += '</div>';
                if (treffer.length > 300) h += '<p class="wz-muted">… weitere ' + (treffer.length - 300) + ' ausgeblendet.</p>';
                out.innerHTML = h;
            }).catch(function(e) { if (out) out.innerHTML = '<p style="color:#c62828;">Fehler: ' + escHtml(e.message) + '</p>'; });
        }

        /* ═══════════ ÜBERSETZEN (Projekt-Werkstatt) ═══════════
           Ein Projekt = eine JSON-Datei: Originaltext in Kapiteln und Absätzen,
           je Absatz Arbeitsübersetzung, Erklärungen, eigene Fassung und Gespräch. */

        var UEB_AUTOSAVE = 'mw-ueb-autosave';
        var uebSpeicherTimer = null;

        function uebP() { return state.uebProjekt || null; }
        function uebKapObj() { var p = uebP(); return p ? p.kapitel[state.uebKap || 0] : null; }
        function uebAbsObj() { var k = uebKapObj(); return k ? k.absaetze[state.uebAbs || 0] : null; }

        /* ---- Text in Kapitel und Absätze teilen ---- */
        function uebTextTeilen(text) {
            var zeilen = String(text).replace(/\r\n?/g, '\n').split('\n');
            var kapMuster = /^\s*(kapitel|chapter|chapitre|capitolo|akt|aufzug|szene|scene|buch|teil|prolog|epilog)\b/i;
            var roemisch = /^\s*[IVXLCDM]+\.?\s*$/;
            var kapitel = [], akt = null, puffer = [];
            function neuesKap(titel) { akt = { titel: titel, uebersicht: '', absaetze: [] }; kapitel.push(akt); }
            function pufferAb() {
                var abs = puffer.join('\n').trim();
                puffer = [];
                if (!abs) return;
                if (!akt) neuesKap('Text');
                akt.absaetze.push({ orig: abs, arbeit: '', kommentar: '', eigene: '', status: 'offen', chat: [] });
            }
            zeilen.forEach(function(z) {
                var t = z.trim();
                if (kapMuster.test(t) || roemisch.test(t)) { pufferAb(); neuesKap(t); return; }
                if (t === '') { pufferAb(); return; }
                puffer.push(z);
            });
            pufferAb();
            kapitel = kapitel.filter(function(k) { return k.absaetze.length; });
            return kapitel.length ? kapitel : null;
        }

        /* ---- Anlegen, Speichern, Laden ---- */
        function uebNeuModal() {
            var spr = (typeof WK_SPRACHEN !== 'undefined' ? WK_SPRACHEN : ['Englisch','Französisch','Deutsch','Italienisch']);
            var c = '<div class="card-row"><label class="card-label" style="display:block;margin-bottom:4px;">Titel</label>'
                  + '<input type="text" id="ueb-neu-titel" class="input" placeholder="z. B. Der letzte Mohikaner"></div>';
            c += '<div style="display:flex;gap:10px;flex-wrap:wrap;">';
            c += '<div class="card-row" style="flex:1;"><label class="card-label" style="display:block;margin-bottom:4px;">Sprache des Originals</label><select id="ueb-neu-quelle" class="input">';
            spr.forEach(function(s) { c += '<option' + (s === 'Englisch' ? ' selected' : '') + '>' + s + '</option>'; });
            c += '</select></div>';
            c += '<div class="card-row" style="flex:1;"><label class="card-label" style="display:block;margin-bottom:4px;">Zielsprache</label><select id="ueb-neu-ziel" class="input">'
               + '<option>Mundart</option><option>Hochdeutsch</option></select></div></div>';
            c += '<div class="card-row"><label class="card-label" style="display:block;margin-bottom:4px;">Originaltext (ganzes Buch oder einzelne Szene)</label>'
               + '<textarea id="ueb-neu-text" class="input" rows="8" placeholder="Text hier einfügen – oder unten eine .txt-Datei wählen"></textarea></div>';
            c += '<div class="card-row"><input type="file" id="ueb-neu-datei" accept=".txt,text/plain" onchange="uebDateiInText(this)"></div>';
            c += '<div style="margin-top:14px;display:flex;gap:10px;">'
               + '<button class="btn" onclick="uebNeuAnlegen()">Projekt anlegen</button>'
               + '<button class="btn" style="background:var(--bg-tertiary);color:var(--text-primary);" onclick="closeModal()">Abbrechen</button></div>';
            showModal('➕ Neues Übersetzungsprojekt', c);
        }

        function uebDateiInText(input) {
            var f = input.files && input.files[0];
            if (!f) return;
            var r = new FileReader();
            r.onload = function() {
                var ta = document.getElementById('ueb-neu-text');
                if (ta) ta.value = r.result;
                showToast('Datei gelesen: ' + f.name, 'success');
            };
            r.readAsText(f);
        }

        function uebNeuAnlegen() {
            var titel = (document.getElementById('ueb-neu-titel') || {}).value || 'Ohne Titel';
            var text = (document.getElementById('ueb-neu-text') || {}).value || '';
            if (!text.trim()) { showToast('Kein Text vorhanden', 'warning'); return; }
            var kapitel = uebTextTeilen(text);
            if (!kapitel) { showToast('Im Text liess sich nichts finden', 'error'); return; }
            closeModal();
            var nAbs = 0; kapitel.forEach(function(k) { nAbs += k.absaetze.length; });
            showToast('Lege an: ' + kapitel.length + ' Kapitel, ' + nAbs + ' Absätze…', 'warning');
            uebInDatenbank({
                titel: titel.trim(),
                quellsprache: (document.getElementById('ueb-neu-quelle') || {}).value || 'Englisch',
                zielsprache: (document.getElementById('ueb-neu-ziel') || {}).value || 'Mundart',
                glossar: [], kapitel: kapitel
            }, function(id) { uebProjektOeffnen(id); });
        }

        /* ---- Speichern: jeder Absatz geht in die Datenbank ----
           Kein Datei-Handling mehr. Beim Tippen wird der aktuelle Absatz nach kurzer
           Pause per PATCH gespeichert, mit Revisions-Zähler gegen stilles Überschreiben.
           Die Datei bleibt als Sicherungskopie (⬇️) und als Import erhalten. */

        var uebPatchTimer = null, uebPatchWartend = {};

        function uebAbsatzDaten(a) {
            return { orig: a.orig || '', arbeit: a.arbeit || '', arbeit_saetze: a.arbeitSaetze || null,
                     kommentar: a.kommentar || '', eigene: a.eigene || '', status: a.status || 'offen',
                     chat: a.chat || [], bearbeitet_von: 'app' };
        }

        function uebFlushAlle() {
            if (uebPatchTimer) { clearTimeout(uebPatchTimer); uebPatchTimer = null; }
            Object.keys(uebPatchWartend).forEach(function(id) {
                var a = uebPatchWartend[id];
                delete uebPatchWartend[id];
                uebAbsatzPatch(a);
            });
        }

        function uebAbsatzPatch(a) {
            if (!a || !a._id) return;
            var alt = a._rev || 1;
            var d = uebAbsatzDaten(a);
            d.revision = alt + 1;
            supabaseCall('ueb_absaetze?id=eq.' + a._id + '&revision=eq.' + alt, {
                method: 'PATCH', body: JSON.stringify(d)
            }).then(function(r) {
                if (Array.isArray(r) && r.length) { a._rev = r[0].revision; return; }
                // Revisionskonflikt: anderswo geändert → Stand holen und die hiesige Fassung
                // mit frischer Revision durchsetzen (wer tippt, hat recht) – aber laut sagen.
                return supabaseCall('ueb_absaetze?id=eq.' + a._id).then(function(rows) {
                    if (!rows || !rows[0]) return;
                    var srv = rows[0].revision;
                    var d2 = uebAbsatzDaten(a);
                    d2.revision = srv + 1;
                    return supabaseCall('ueb_absaetze?id=eq.' + a._id + '&revision=eq.' + srv, {
                        method: 'PATCH', body: JSON.stringify(d2)
                    }).then(function(r2) {
                        if (Array.isArray(r2) && r2.length) a._rev = r2[0].revision;
                        showToast('⚠️ Dieser Absatz wurde auch anderswo geändert – deine Fassung gilt jetzt', 'warning');
                    });
                });
            }).catch(function(e) { showToast('Speichern fehlgeschlagen: ' + e.message, 'error'); });
        }

        /* ---- Projektliste und Öffnen ---- */

        function uebProjekteListe() {
            if (!state.accessToken) return;
            supabaseCall('ueb_projekte?select=id,titel,quellsprache,zielsprache,updated_at&archiviert=eq.false&order=updated_at.desc')
                .then(function(d) { state.uebListe = d || []; render(); })
                .catch(function(e) { state.uebListe = []; showToast('Projektliste: ' + e.message, 'error'); render(); });
        }

        function uebProjektOeffnen(id) {
            showToast('Lade Projekt…', 'warning');
            Promise.all([
                supabaseCall('ueb_projekte?id=eq.' + id),
                supabaseCall('ueb_kapitel?projekt_id=eq.' + id + '&order=position.asc'),
                supabaseCall('ueb_absaetze?projekt_id=eq.' + id + '&order=position.asc&limit=10000')
            ]).then(function(res) {
                var p = res[0] && res[0][0];
                if (!p) throw new Error('Projekt nicht gefunden');
                var proKapitel = {};
                var kapitel = (res[1] || []).map(function(k) {
                    var o = { _id: k.id, titel: k.titel, uebersicht: k.uebersicht || '', absaetze: [] };
                    proKapitel[k.id] = o;
                    return o;
                });
                (res[2] || []).forEach(function(r) {
                    var k = proKapitel[r.kapitel_id];
                    if (!k) return;
                    k.absaetze.push({ _id: r.id, _rev: r.revision, orig: r.orig || '', arbeit: r.arbeit || '',
                        arbeitSaetze: r.arbeit_saetze || null, kommentar: r.kommentar || '',
                        eigene: r.eigene || '', status: r.status || 'offen', chat: r.chat || [] });
                });
                state.uebProjekt = { _id: p.id, format: 'mundart-uebersetzung', version: 1,
                    titel: p.titel, quellsprache: p.quellsprache, zielsprache: p.zielsprache,
                    glossar: p.glossar || [], kapitel: kapitel };
                state.uebKap = 0; state.uebAbs = 0;
                for (var i = 0; i < kapitel.length; i++) {
                    for (var j = 0; j < kapitel[i].absaetze.length; j++) {
                        if (kapitel[i].absaetze[j].status !== 'fertig') { state.uebKap = i; state.uebAbs = j; i = kapitel.length; break; }
                    }
                }
                state.uebWort = null; state.uebWb = null;
                render();
                showToast('«' + p.titel + '» geladen', 'success');
            }).catch(function(e) { showToast('Öffnen fehlgeschlagen: ' + e.message, 'error'); });
        }

        /* ---- Neues Projekt / Import in die Datenbank schreiben ---- */
        function uebInDatenbank(pd, fertig) {
            var projId;
            supabaseCall('ueb_projekte', { method: 'POST', body: JSON.stringify({
                titel: pd.titel || 'Ohne Titel', quellsprache: pd.quellsprache || 'Englisch',
                zielsprache: pd.zielsprache || 'Mundart', glossar: pd.glossar || [] }) })
            .then(function(r) {
                projId = r[0].id;
                var kk = pd.kapitel.map(function(k, i) {
                    return { projekt_id: projId, position: i + 1, titel: k.titel || 'Text', uebersicht: k.uebersicht || '' };
                });
                return supabaseCall('ueb_kapitel', { method: 'POST', body: JSON.stringify(kk) });
            }).then(function(krows) {
                var proPos = {};
                (krows || []).forEach(function(k) { proPos[k.position] = k.id; });
                var alle = [];
                pd.kapitel.forEach(function(k, i) {
                    (k.absaetze || []).forEach(function(a, j) {
                        alle.push({ kapitel_id: proPos[i + 1], projekt_id: projId, position: j + 1,
                            orig: a.orig || '', arbeit: a.arbeit || '', arbeit_saetze: a.arbeitSaetze || null,
                            kommentar: a.kommentar || '', eigene: a.eigene || '',
                            status: a.status || 'offen', chat: a.chat || [] });
                    });
                });
                var i = 0;
                function block() {
                    if (i >= alle.length) return Promise.resolve();
                    var teil = alle.slice(i, i + 200); i += 200;
                    return supabaseCall('ueb_absaetze', { method: 'POST', body: JSON.stringify(teil),
                        headers: { 'Prefer': 'return=minimal' } }).then(block);
                }
                return block();
            }).then(function() { fertig(projId); })
            .catch(function(e) { showToast('Anlegen fehlgeschlagen: ' + e.message, 'error'); });
        }

        // Dateiname: Projektname-woerterbuch-Datum-Uhrzeit
        function uebDateiname() {
            var p = uebP();
            var d = new Date();
            function z(n) { return (n < 10 ? '0' : '') + n; }
            return (p.titel || 'projekt').replace(/[^\wäöüÄÖÜéèà -]/g, '').replace(/\s+/g, '_')
                + '-woerterbuch-' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate())
                + '-' + z(d.getHours()) + z(d.getMinutes()) + '.json';
        }

        /* ---- Sicherungskopie (Export) und Import ---- */

        function uebExportObjekt() {
            var p = uebP();
            return { format: 'mundart-uebersetzung', version: 1, titel: p.titel,
                quellsprache: p.quellsprache, zielsprache: p.zielsprache,
                geaendert: new Date().toISOString().slice(0, 10), glossar: p.glossar || [],
                kapitel: (p.kapitel || []).map(function(k) {
                    return { titel: k.titel, uebersicht: k.uebersicht || '',
                        absaetze: (k.absaetze || []).map(function(a) {
                            var o = { orig: a.orig || '', arbeit: a.arbeit || '', kommentar: a.kommentar || '',
                                      eigene: a.eigene || '', status: a.status || 'offen', chat: a.chat || [] };
                            if (a.arbeitSaetze) o.arbeitSaetze = a.arbeitSaetze;
                            return o;
                        }) };
                }) };
        }

        function uebDownload() {
            var name = uebDateiname();
            var blob = new Blob([JSON.stringify(uebExportObjekt())], { type: 'application/json' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = name;
            document.body.appendChild(a); a.click();
            setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 500);
            showToast('Sicherungskopie: ' + name, 'success');
        }

        function uebLadenKlick() {
            var inp = document.getElementById('ueb-datei-input');
            if (inp) inp.click();
        }

        function uebLadenDatei(input) {
            var f = input.files && input.files[0];
            if (!f) return;
            var r = new FileReader();
            r.onload = function() { uebProjektAusText(r.result); };
            r.readAsText(f);
        }

        // Import: Datei → Datenbank → öffnen
        function uebProjektAusText(text) {
            try {
                var p = JSON.parse(text);
                if (p.format !== 'mundart-uebersetzung' || !p.kapitel) throw new Error('Das ist keine Projektdatei');
                showToast('Importiere «' + (p.titel || '') + '» in die Datenbank…', 'warning');
                uebInDatenbank(p, function(id) { uebProjektOeffnen(id); });
            } catch (e) { showToast('Fehler: ' + e.message, 'error'); }
        }

        // Aktuellen Absatz zum Speichern vormerken (kurz verzögert, damit Tippen flüssig bleibt)
        function uebMerken() {
            var a = uebAbsObj();
            if (!a || !a._id) return;
            uebPatchWartend[a._id] = a;
            if (uebPatchTimer) clearTimeout(uebPatchTimer);
            uebPatchTimer = setTimeout(uebFlushAlle, 900);
        }

        function uebSchliessen() {
            uebFlushAlle();
            state.uebProjekt = null;
            uebProjekteListe();
            render();
        }

        /* ---- Felder und Navigation ---- */

        // Felder wachsen mit dem Inhalt – kein Scrollen, kein Zurückspringen
        function uebAuto(el) {
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight + 4, 1200) + 'px';
        }
        function uebAutoAlle() {
            var alle = document.querySelectorAll('.ueb-ta');
            for (var i = 0; i < alle.length; i++) uebAuto(alle[i]);
        }

        function uebFeld(name, wert) {
            var a = uebAbsObj();
            if (!a) return;
            a[name] = wert;
            if (name === 'arbeit') a.arbeitSaetze = null;   // Handarbeit am Ganzen löst die Satzeinteilung ab
            if (name === 'eigene') { uebGlossarHinweisNeu(); uebBisherNeu(); }
            uebMerken();
        }

        function uebGehe(kap, abs) {
            var p = uebP();
            if (!p) return;
            uebFlushAlle();   // Offenes speichern, bevor der Absatz wechselt
            kap = Math.max(0, Math.min(kap, p.kapitel.length - 1));
            abs = Math.max(0, Math.min(abs, p.kapitel[kap].absaetze.length - 1));
            state.uebKap = kap; state.uebAbs = abs;
            state.uebWort = null; state.uebWb = null;
            render();
        }

        function uebWeiter(richtung) {
            var p = uebP(); if (!p) return;
            var k = state.uebKap || 0, a = (state.uebAbs || 0) + richtung;
            if (a < 0) { if (k > 0) { k--; a = p.kapitel[k].absaetze.length - 1; } else a = 0; }
            if (a >= p.kapitel[k].absaetze.length) { if (k < p.kapitel.length - 1) { k++; a = 0; } else a = p.kapitel[k].absaetze.length - 1; }
            uebGehe(k, a);
        }

        function uebFertig() {
            var a = uebAbsObj(); if (!a) return;
            a.status = a.status === 'fertig' ? 'offen' : 'fertig';
            uebMerken(); render();
        }

        /* ---- Satz für Satz übersetzen ---- */

        function uebSaetze(text) {
            var t = String(text).replace(/\s+/g, ' ').trim();
            return t.match(/[^.!?]+[.!?]+[»«"')\]]*\s*|[^.!?]+$/g) || [t];
        }

        function uebSatzModus() {
            var a = uebAbsObj();
            if (!a) return;
            state.uebSatzAn = !state.uebSatzAn;
            state.uebSatzN = 0;
            if (state.uebSatzAn) {
                var s = uebSaetze(a.orig);
                if (!a.arbeitSaetze || a.arbeitSaetze.length !== s.length) {
                    // Vorhandene Arbeitsübersetzung möglichst auf die Sätze verteilen
                    var alt = (a.arbeit || '').trim() ? uebSaetze(a.arbeit) : [];
                    a.arbeitSaetze = [];
                    for (var i = 0; i < s.length; i++) a.arbeitSaetze.push((alt[i] || '').trim());
                }
                // Beim ersten unübersetzten Satz beginnen
                for (var j = 0; j < a.arbeitSaetze.length; j++) if (!a.arbeitSaetze[j].trim()) { state.uebSatzN = j; break; }
            }
            render();
        }

        function uebSatzGehe(d) {
            var a = uebAbsObj();
            if (!a) return;
            var n = uebSaetze(a.orig).length;
            state.uebSatzN = Math.max(0, Math.min((state.uebSatzN || 0) + d, n - 1));
            render();
        }

        function uebSatzFeld(el) {
            var a = uebAbsObj();
            if (!a || !a.arbeitSaetze) return;
            a.arbeitSaetze[state.uebSatzN || 0] = el.value;
            a.arbeit = a.arbeitSaetze.map(function(x) { return (x || '').trim(); })
                        .filter(function(x) { return x; }).join(' ');
            uebAuto(el);
            uebMerken();
        }

        // Einen einzelnen Satz von der KI übersetzen lassen (mit dem Satz davor als Zusammenhang)
        function uebSatzKi() {
            var p = uebP(), a = uebAbsObj();
            if (!a) return;
            if (!kiBereit()) { showToast('Kein API-Schlüssel – siehe Reiter KI', 'error'); return; }
            var s = uebSaetze(a.orig), n = state.uebSatzN || 0;

        /* ---- Etappe 2: Verstehen ---- */
        function uebArbeit() {

            var sys = 'Du bist literarischer Übersetzer und Lektor. Quellsprache: ' + p.quellsprache + '.\n\n'
              + 'AUFGABE 1 – ARBEITSÜBERSETZUNG: Übersetze den Abschnitt in präzises SCHWEIZER Hochdeutsch (nie ß, immer ss; Anführungszeichen «»). '

            kiFrage(sys, user, 3500, false).then(function(antw) {

        /* ---- Etappe 3: Übersetzen ---- */

        // Doppelklick in der Arbeitsübersetzung → Mundartwörter aus den Synonymen
        function uebDoppelklick(ta) {
            var p = uebP();
            if (!p || p.zielsprache !== 'Mundart') return;
            var wort = '';
            if (ta.selectionStart != null) {
                wort = ta.value.slice(ta.selectionStart, ta.selectionEnd).trim();
                // Den Satz rund um die Klickstelle merken – für die Grundform-Bestimmung im Zusammenhang
                var t = ta.value, i = ta.selectionStart;
                var von = Math.max(t.lastIndexOf('.', i), t.lastIndexOf('!', i), t.lastIndexOf('?', i), t.lastIndexOf('\n', i)) + 1;
                var bis = t.length;
                ['.', '!', '?', '\n'].forEach(function(z) { var x = t.indexOf(z, i); if (x >= 0 && x < bis) bis = x + 1; });
                state.uebWbSatz = t.slice(von, bis).trim();
            }
            wort = wort.replace(/[^A-Za-zÄÖÜäöüßéèà-]/g, '');
            if (wort.length < 3) return;
            uebWbSuche(wort);
        }

        /* Mögliche Grundformen eines gebeugten deutschen Wortes.
           «schlichen» → schleichen findet erst die KI-Stufe; die Regeln hier decken
           die häufigen regelmässigen Formen ab: läuft→lauf(en), Häuser→haus,
           gemacht→machen, schöne→schön, sagte→sagen. */
        function uebLemmata(wort) {
            var lw = wort.toLowerCase(), prio = [], rest = [], da = {};
            function add(liste, x) { if (x && x.length >= 3 && !da[x]) { da[x] = 1; liste.push(x); } }
            add(prio, lw);
            var m;
            // Starke Lemmata zuerst: ge-Partizip und Umlaut-Rückbildung ändern den Wortanfang,
            // sind aber die verlässlichsten Grundformen
            if ((m = /^ge(.+)t$/.exec(lw)))  { add(prio, m[1] + 'en'); add(prio, m[1] + 'n'); }   // gemacht → machen
            if ((m = /^ge(.+)en$/.exec(lw))) { add(prio, m[1] + 'en'); }                          // gelaufen → laufen
            var uml = lw.replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u');
            if (uml !== lw) {
                add(prio, uml);
                ['er','en','e','n','t','st'].forEach(function(e) {
                    if (uml.length > e.length + 2 && uml.slice(-e.length) === e) { add(prio, uml.slice(0, -e.length)); add(prio, uml.slice(0, -e.length) + 'en'); }
                });
            }
            // Endungsvarianten als schwächere Kandidaten
            ['ste','st','est','ete','eten','etest','te','ten','test','tet','ende','end','er','es','em','en','et','e','t','n','s'].forEach(function(e) {
                if (lw.length > e.length + 2 && lw.slice(-e.length) === e) {
                    var st = lw.slice(0, -e.length);
                    add(rest, st); add(rest, st + 'en'); add(rest, st + 'e'); add(rest, st + 'n');
                }
            });
            // Die dem Wort ähnlichsten Endungsvarianten zuerst
            function gleichVorn(x) {
                var n = 0;
                while (n < x.length && n < lw.length && x.charAt(n) === lw.charAt(n)) n++;
                return n;
            }
            rest.sort(function(a, b) { return (gleichVorn(b) - gleichVorn(a)) || (b.length - a.length); });
            return prio.concat(rest).slice(0, 10);
        }

        // Suche von Hand: eingegebenes Wort gilt als Grundform, keine Kandidatenbildung nötig
        function uebWbHand() {
            var el = document.getElementById('ueb-wb-eingabe');
            var w = (el ? el.value : '').trim().replace(/[^A-Za-zÄÖÜäöüßéèà -]/g, '');
            if (w.length < 3) { showToast('Mindestens drei Buchstaben', 'warning'); return; }
            state.uebWbSatz = '';
            uebWbSuche(w, true);
        }

        function uebWbSuche(wort, schonGrundform) {
            state.uebWb = { wort: wort, treffer: null, laeuft: true };
            uebWbBox();
            var lw = wort.toLowerCase();
            // Kurzstämme unter 4 Buchstaben suchen zu viel Zufall («wei» steckt in weiss, weil, weinen)
            var kand = (schonGrundform ? [lw] : uebLemmata(wort)).filter(function(k) { return k.length >= 4 || k === lw; });
            var teile = kand.map(function(k) { return 'synonyme.ilike.' + encodeURIComponent('*' + k + '*'); });
            teile.push('begriff.ilike.' + encodeURIComponent(lw));
            supabaseCall('woerter?select=id,begriff,wortart,synonyme,bedeutung,beispielsatz&or=(' + teile.join(',') + ')&limit=80')
                .then(function(d) {
                    d = d || [];
                    d.forEach(function(t) {
                        t._rang = 99;
                        // Ein Synonym zählt als GANZES Wort («weit» trifft, «weiss» nicht).
                        // Wie in der Wörterbuch-Suche zählen auch Synonyme, die mit dem Wort
                        // BEGINNEN («weiter», «weitab») – aber schwächer gewichtet.
                        var syns = (t.synonyme || '').toLowerCase().split(/\s*[,;]\s*/);
                        for (var i = 0; i < kand.length; i++) {
                            for (var j = 0; j < syns.length; j++) {
                                var s = syns[j];
                                if (s === kand[i] || s.split(/\s+/)[0] === kand[i])   // auch «weit weg»
                                    t._rang = Math.min(t._rang, i);
                                else if (i < 2 && s.indexOf(kand[i]) === 0)           // beginnt damit
                                    t._rang = Math.min(t._rang, 30 + i);
                            }
                        }
                        if ((t.begriff || '').toLowerCase() === lw) t._rang = 0;
                    });
                    d = d.filter(function(t) { return t._rang < 99; });
                    d.sort(function(x, y) { return x._rang - y._rang; });
                    if (!d.length && !schonGrundform && kiBereit()) { uebWbGrundform(wort); return; }
                    state.uebWb = { wort: wort, treffer: d.slice(0, 12), laeuft: false, grundform: schonGrundform ? wort : null };
                    uebWbBox();
                }).catch(function() {
                    state.uebWb = { wort: wort, treffer: [], laeuft: false };
                    uebWbBox();
                });
        }

        // Zweite Stufe: die KI bestimmt die Grundform AUS DEM SATZ (weite Grenze → weit,
        // schlich → schleichen), dann wird mit der Grundform gesucht
        function uebWbGrundform(wort) {
            state.uebWb = { wort: wort, treffer: null, laeuft: true, sucheGrundform: true };
            uebWbBox();
            var satz = state.uebWbSatz || '';
            var sys = 'Bestimme die Grundform des markierten deutschen Wortes, wie es IM SATZ gebraucht wird: '
                    + 'Infinitiv bei Verben, Nominativ Einzahl bei Substantiven, ungebeugte Form bei Adjektiven '
                    + '(«weite Grenze» → weit, «schlich» → schleichen, «Häusern» → Haus). '
                    + 'Antworte AUSSCHLIESSLICH mit diesem einen Wort.';
            var user = 'WORT: ' + wort + (satz ? '\nSATZ: ' + satz : '');
            kiFrage(sys, user, 20, false)
                .then(function(a) {
                    var g = (a || '').trim().split(/\s/)[0].replace(/[^A-Za-zÄÖÜäöüß-]/g, '');
                    if (g && g.toLowerCase() !== wort.toLowerCase()) uebWbSuche(g, true);
                    else if (g) uebWbSuche(g, true);
                    else { state.uebWb = { wort: wort, treffer: [], laeuft: false }; uebWbBox(); }
                })
                .catch(function() { state.uebWb = { wort: wort, treffer: [], laeuft: false }; uebWbBox(); });
        }

            }

        }

        // Gespräch am Absatz
        function uebChatSenden() {
            var p = uebP(), a = uebAbsObj();
            if (!a) return;
            if (!kiBereit()) { showToast('Kein API-Schlüssel – siehe Reiter KI', 'error'); return; }
            var el = document.getElementById('ueb-chat-eingabe');
            var frage = el ? el.value.trim() : '';
            if (!frage) return;
            if (el) el.value = '';
            a.chat.push({ role: 'user', content: frage });
            state.uebChatLaeuft = true;
            uebChatBox();

            var sys = 'ROLLE: Du bist Gesprächspartner eines erfahrenen Literaturübersetzers – ein offenes Gespräch, wie in einem Chat. '
                  + 'Du siehst jeweils Original, Arbeitsübersetzung und seine aktuelle Fassung.\n'
                  + (p.zielsprache === 'Mundart'
                     ? 'Er übersetzt in Schweizer Mundart. Die beherrscht er besser als du: Gib KEINE Mundart-Belehrungen, '
                       + 'keine Schreibregeln und keine ungefragten Stilvorschriften. Die Schreibweise prüft er später selber.\n'
                     : 'Er übersetzt in Schweizer Hochdeutsch (nie ß, immer ss).\n')
                  + 'Du tust, worum er dich bittet: Inhaltstreue prüfen (seine Fassung ehrlich gegen das Original halten und Abweichungen, '
                  + 'Auslassungen oder Verschiebungen konkret benennen), Fragen zum Original beantworten, im Netz recherchieren, '
                  + 'Alternativen und Wendungen diskutieren. Ungefragt korrigierst du nichts.\n'
                  + 'Antworte knapp und direkt, Fliesstext, Schweizer Hochdeutsch (nie ß), ohne Vorrede.';
            var glossarText = (p.glossar || []).map(function(g) { return g.von + ' = ' + g.zu; }).join('; ');
            var kontext = 'ORIGINAL (' + p.quellsprache + '):\n' + a.orig
                + '\n\nARBEITSÜBERSETZUNG:\n' + (a.arbeit || '—')
                + '\n\nSEINE AKTUELLE FASSUNG:\n' + (a.eigene || '— (noch leer)')
                + (glossarText ? '\n\nGLOSSAR (feste Übersetzungen): ' + glossarText : '');
            var msgs = a.chat.slice(-8).map(function(m) { return { role: m.role, content: m.content }; });
            msgs[msgs.length - 1] = { role: 'user', content: kontext + '\n\n---\nFRAGE:\n' + frage };

            kiFrageVerlauf(sys, msgs, 1800, true).then(function(antw) {
                a.chat.push({ role: 'assistant', content: antw || '(keine Antwort)' });
                state.uebChatLaeuft = false; uebMerken(); uebChatBox();
            }).catch(function(e) {
                a.chat.push({ role: 'assistant', content: '⚠️ ' + e.message });
                state.uebChatLaeuft = false; uebChatBox();
            });
        }

        function uebChatBox() {
            var box = document.getElementById('ueb-chat-log');
            if (!box) return;
            var a = uebAbsObj();
            var v = (a && a.chat) || [];
            var h = '';
            if (!v.length) h = '<div class="wz-muted">Frag hier: «Stimmt der Inhalt noch?», «Geht das kürzer?», «Andere Wendung für …?»</div>';
            v.slice(-12).forEach(function(m) {
                var ich = m.role === 'user';
                h += '<div style="margin-bottom:8px;padding:7px 10px;border-radius:8px;font-size:13px;'
                   + (ich ? 'background:var(--bg-tertiary);' : 'background:var(--bg-secondary);border:1px solid var(--border-color);')
                   + '"><b style="color:var(--accent-color);">' + (ich ? 'Du' : 'KI') + '</b><br>' + kiMarkdown(m.content) + '</div>';
            });
            if (state.uebChatLaeuft) h += '<div class="wz-muted">KI denkt nach…</div>';
            box.innerHTML = h;
            box.scrollTop = box.scrollHeight;
        }

        function uebChatLeeren() {
            var a = uebAbsObj();
            if (a) { a.chat = []; uebMerken(); uebChatBox(); }
        }

        /* ---- Bisher übersetzt (nummeriert herauskopieren, über Nummern wiedereinsetzen) ----
           Jeder Absatz trägt seine Adresse: ¶Kapitel.Absatz – daran erkennt die App beim
           Wiedereinsetzen, wohin der Text gehört. Reihenfolge und Lücken spielen keine Rolle. */

        function uebKapText() {
            var k = uebKapObj();
            if (!k) return '';
            var ki = (state.uebKap || 0) + 1;
            var teile = [];
            k.absaetze.forEach(function(a, ai) {
                if ((a.eigene || '').trim()) teile.push('¶' + ki + '.' + (ai + 1) + '  ' + a.eigene.trim());
            });
            return teile.join('\n\n');
        }

        function uebWerkTextNummeriert() {
            var p = uebP(), teile = [];
            p.kapitel.forEach(function(k, ki) {
                k.absaetze.forEach(function(a, ai) {
                    if ((a.eigene || '').trim()) teile.push('¶' + (ki + 1) + '.' + (ai + 1) + '  ' + a.eigene.trim());
                });
            });
            return teile.join('\n\n');
        }

        function uebBisherNeu() {
            var ta = document.getElementById('ueb-bisher');
            if (ta) ta.value = uebKapText();
        }

        function uebBisherKopieren(ganzes) {
            var t = ganzes ? uebWerkTextNummeriert() : uebKapText();
            if (!t.trim()) { showToast('Noch nichts übersetzt', 'warning'); return; }
            if (navigator.clipboard) navigator.clipboard.writeText(t).then(function() { showToast('Kopiert – die ¶-Nummern bitte stehen lassen', 'success'); });
        }

        function uebEinsetzenModal() {
            var c = '<p class="wz-muted" style="margin-bottom:8px;">Füge hier den in Pages überarbeiteten Text ein – Kapitel oder ganzes Werk. '
                  + 'Die App erkennt jeden Absatz an seiner <b>¶-Nummer</b> und legt ihn an der richtigen Stelle ab. '
                  + 'Reihenfolge und Lücken spielen keine Rolle; nur die Nummern müssen stehen bleiben.</p>'
                  + '<textarea id="ueb-einsetzen-ta" class="input" rows="12"></textarea>'
                  + '<div style="margin-top:12px;display:flex;gap:10px;">'
                  + '<button class="btn" onclick="uebEinsetzen()">Einsetzen</button>'
                  + '<button class="btn" style="background:var(--bg-tertiary);color:var(--text-primary);" onclick="closeModal()">Abbrechen</button></div>';
            showModal('↩ Überarbeitete Fassung einsetzen', c);
        }

        function uebEinsetzen() {
            var p = uebP();
            var ta = document.getElementById('ueb-einsetzen-ta');
            var text = (ta ? ta.value : '').trim();
            if (!text) { showToast('Nichts eingefügt', 'warning'); return; }
            var re = /¶\s*(\d+)\s*\.\s*(\d+)\s*/g;
            var marken = [], m;
            while ((m = re.exec(text)) !== null) marken.push({ kap: parseInt(m[1], 10) - 1, abs: parseInt(m[2], 10) - 1, von: m.index, bis: re.lastIndex });
            if (!marken.length) {
                showToast('Keine ¶-Nummern gefunden. Sie müssen im Text stehen bleiben, sonst weiss die App nicht, wohin die Absätze gehören.', 'error');
                return;
            }
            var uebernommen = 0, fremd = 0;
            marken.forEach(function(mk, i) {
                var inhalt = text.slice(mk.bis, i + 1 < marken.length ? marken[i + 1].von : text.length).trim();
                if (!inhalt) return;
                var k = p.kapitel[mk.kap];
                var a = k && k.absaetze[mk.abs];
                if (!a) { fremd++; return; }
                a.eigene = inhalt;
                if (a._id) uebPatchWartend[a._id] = a;
                uebernommen++;
            });
            uebFlushAlle(); closeModal(); render();
            showToast('✓ ' + uebernommen + ' Absätze übernommen'
                + (fremd ? ' – ' + (fremd === 1 ? 'eine Nummer gab es nicht, übersprungen' : fremd + ' Nummern gab es nicht, übersprungen') : ''),
                fremd ? 'warning' : 'success');
        }

        /* ---- Glossar ---- */
        function uebGlossarModal() {
            var p = uebP(); if (!p) return;
            var zeilen = (p.glossar || []).map(function(g) { return g.von + ' = ' + g.zu; }).join('\n');
            var c = '<p class="wz-muted" style="margin-bottom:8px;">Eine Zeile je Eintrag: <code>Original = Übersetzung</code>. '
                  + 'Namen, wiederkehrende Begriffe, Anreden. Die App mahnt, wenn deine Fassung davon abweicht.</p>'
                  + '<textarea id="ueb-glossar-ta" class="input" rows="10" placeholder="wilderness = Wildnis&#10;Hawkeye = Falkenaug">' + escHtml(zeilen) + '</textarea>'
                  + '<div style="margin-top:12px;display:flex;gap:10px;">'
                  + '<button class="btn" onclick="uebGlossarSpeichern()">Speichern</button>'
                  + '<button class="btn" style="background:var(--bg-tertiary);color:var(--text-primary);" onclick="closeModal()">Abbrechen</button></div>';
            showModal('📇 Glossar', c);
        }

        function uebGlossarSpeichern() {
            var p = uebP(); if (!p) return;
            var ta = document.getElementById('ueb-glossar-ta');
            var g = [];
            (ta ? ta.value : '').split('\n').forEach(function(z) {
                var m = z.split('=');
                if (m.length >= 2) {
                    var von = m[0].trim(), zu = m.slice(1).join('=').trim();
                    if (von && zu) g.push({ von: von, zu: zu });
                }
            });
            p.glossar = g;
            if (p._id) supabaseCall('ueb_projekte?id=eq.' + p._id, { method: 'PATCH', body: JSON.stringify({ glossar: g }) })
                .catch(function(e) { showToast('Glossar speichern: ' + e.message, 'error'); });
            closeModal(); uebGlossarHinweisNeu();
            showToast(g.length + ' Glossareinträge', 'success');
        }

        function uebGlossarHinweise() {
            var p = uebP(), a = uebAbsObj();
            if (!p || !a || !(p.glossar || []).length) return [];
            var funde = [];
            var lo = a.orig.toLowerCase(), le = (a.eigene || '').toLowerCase();
            if (!le.trim()) return [];
            p.glossar.forEach(function(g) {
                if (lo.indexOf(g.von.toLowerCase()) >= 0 && le.indexOf(g.zu.toLowerCase()) < 0)
                    funde.push(g);
            });
            return funde;
        }

        function uebGlossarHinweisNeu() {
            var box = document.getElementById('ueb-glossar-hinweis');
            if (!box) return;
            var funde = uebGlossarHinweise();
            box.innerHTML = funde.length
                ? '<div style="margin-top:6px;font-size:12px;color:#b45309;">📇 Laut Glossar erwartet: '
                  + funde.map(function(g) { return escHtml(g.von) + ' → <b>' + escHtml(g.zu) + '</b>'; }).join(' · ') + '</div>'
                : '';
        }

        /* ---- Etappe 4: Konkordanz und Export ---- */
        function uebKonkordanzModal() {
            var c = '<div class="wz-row"><input type="text" id="ueb-konk-eingabe" class="input" style="flex:1;" placeholder="Wort oder Wendung – Original oder Übersetzung" '
                  + 'onkeypress="if(event.key===\'Enter\')uebKonkordanz()">'
                  + '<button class="btn" onclick="uebKonkordanz()">Suchen</button></div>'
                  + '<div id="ueb-konk-out" style="margin-top:10px;max-height:420px;overflow:auto;"></div>';
            showModal('🔎 Wie habe ich das bisher übersetzt?', c);
            setTimeout(function() { var el = document.getElementById('ueb-konk-eingabe'); if (el) el.focus(); }, 100);
        }

        function uebKonkordanz() {
            var p = uebP(); if (!p) return;
            var el = document.getElementById('ueb-konk-eingabe');
            var s = (el ? el.value : '').trim().toLowerCase();
            var out = document.getElementById('ueb-konk-out');
            if (!s || s.length < 2 || !out) return;
            var h = '', n = 0;
            p.kapitel.forEach(function(k, ki) {
                k.absaetze.forEach(function(a, ai) {
                    var imOrig = a.orig.toLowerCase().indexOf(s) >= 0;
                    var imEigen = (a.eigene || '').toLowerCase().indexOf(s) >= 0;
                    if (!imOrig && !imEigen) return;
                    if (++n > 30) return;
                    function schnipsel(t) {
                        var i = t.toLowerCase().indexOf(s);
                        if (i < 0) return '';
                        var von = Math.max(0, i - 60);
                        return (von > 0 ? '…' : '') + escHtml(t.slice(von, i)) + '<mark>' + escHtml(t.slice(i, i + s.length)) + '</mark>' + escHtml(t.slice(i + s.length, i + s.length + 60)) + '…';
                    }
                    h += '<div style="border-top:1px solid var(--border-color);padding:8px 0;font-size:13px;">'
                       + '<a href="#" onclick="closeModal();uebGehe(' + ki + ',' + ai + ');return false;" style="color:var(--accent-color);">' + escHtml(k.titel) + ', Absatz ' + (ai + 1) + '</a><br>'
                       + (imOrig ? '<span class="wz-muted">Original:</span> ' + schnipsel(a.orig) + '<br>' : '')
                       + (imEigen ? '<span class="wz-muted">Deine Fassung:</span> ' + schnipsel(a.eigene) : '')
                       + '</div>';
                });
            });
            out.innerHTML = h || '<div class="wz-muted">Nichts gefunden.</div>';
        }

        function uebExportModal() {
            var p = uebP(); if (!p) return;
            var nF = 0, nA = 0;
            p.kapitel.forEach(function(k) { k.absaetze.forEach(function(a) { nA++; if ((a.eigene || '').trim()) nF++; }); });
            var c = '<p class="wz-muted">' + nF + ' von ' + nA + ' Absätzen haben eine eigene Fassung.</p>'
                  + '<div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">'
                  + '<button class="btn" onclick="uebSprechfassung()">🗣️ Sprechfassung öffnen (zum Drucken)</button>'
                  + '<button class="btn" onclick="uebTextExport()">⬇️ Übersetzung als Textdatei</button>'
                  + '<button class="btn" onclick="uebZurPruefung()">🔍 Zur Schreibweise-Prüfung schicken</button>'
                  + '</div>';
            showModal('📤 Export', c);
        }

        function uebGanzerText() {
            var p = uebP(), teile = [];
            p.kapitel.forEach(function(k) {
                var abs = k.absaetze.filter(function(a) { return (a.eigene || '').trim(); }).map(function(a) { return a.eigene.trim(); });
                if (abs.length) teile.push((p.kapitel.length > 1 ? k.titel + '\n\n' : '') + abs.join('\n\n'));
            });
            return teile.join('\n\n\n');
        }

        function uebSprechfassung() {
            var p = uebP();
            var w = window.open('', '_blank');
            if (!w) { showToast('Popup blockiert', 'error'); return; }
            var html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + escHtml(p.titel) + ' – Sprechfassung</title>'
                + '<style>body{font-family:Georgia,serif;font-size:16pt;line-height:1.7;max-width:44em;margin:2em auto;padding:0 1em;}h2{font-size:14pt;margin-top:2em;color:#555;}p{margin:0 0 .8em;}</style></head><body>'
                + '<h1 style="font-size:16pt;">' + escHtml(p.titel) + '</h1>';
            p.kapitel.forEach(function(k) {
                var abs = k.absaetze.filter(function(a) { return (a.eigene || '').trim(); });
                if (!abs.length) return;
                if (p.kapitel.length > 1) html += '<h2>' + escHtml(k.titel) + '</h2>';
                abs.forEach(function(a) { html += '<p>' + escHtml(a.eigene.trim()).replace(/\n/g, '<br>') + '</p>'; });
            });
            html += '</body></html>';
            w.document.write(html); w.document.close();
        }

        function uebTextExport() {
            var p = uebP();
            var blob = new Blob([p.titel + '\n\n' + uebGanzerText()], { type: 'text/plain;charset=utf-8' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (p.titel || 'uebersetzung').replace(/[^\wäöüÄÖÜ -]/g, '').replace(/\s+/g, '_') + '.txt';
            document.body.appendChild(a); a.click();
            setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 500);
        }

        function uebZurPruefung() {
            state.pruefText = uebGanzerText();
            state.pruefErgebnis = null;
            state.pruefZurueck = null;
            closeModal();
            state.adminTab = 'pruefen';
            render();
            showToast('Text übergeben – jetzt «Prüfen» drücken', 'success');
        }

        // Einen einzelnen Absatz prüfen lassen – mit Rückfahrkarte in die Übersetzung
        function uebAbsatzPruefen() {
            var a = uebAbsObj();
            if (!a || !(a.eigene || '').trim()) { showToast('Dieser Absatz hat noch keine eigene Fassung', 'warning'); return; }
            state.pruefText = a.eigene;
            state.pruefErgebnis = null;
            state.pruefZurueck = { kap: state.uebKap || 0, abs: state.uebAbs || 0 };
            state.adminTab = 'pruefen';
            render();
            pruefText();   // Prüfung läuft sofort, KI-Urteil folgt automatisch
        }

        /* ---- Ansicht ---- */
        function uebOrigHtml(text) {
            var h = '';
            String(text).split(/([A-Za-zÀ-ÿĀ-ž'’-]+)/).forEach(function(t) {
                if (/^[A-Za-zÀ-ÿĀ-ž'’-]+$/.test(t) && t.length > 1)
                    h += '<span class="ueb-w" onclick="uebWortKlick(this)">' + escHtml(t) + '</span>';
                else h += escHtml(t);
            });
            return h.replace(/\n/g, '<br>');
        }

            h += '</div>';

        // Admin
        function renderAdmin() {
            var pendingCount = state.pendingChanges.length;
            var tabs = '<div class="tabs">';
            tabs += '<button class="tab-btn' + (state.adminTab === 'freigaben' ? ' active' : '') + '" onclick="changeAdminTab(\'freigaben\')">Freigaben' + (pendingCount > 0 ? '<span class="pending-badge">' + pendingCount + '</span>' : '') + '</button>';
            tabs += '<button class="tab-btn' + (state.adminTab === 'tabelle' ? ' active' : '') + '" onclick="changeAdminTab(\'tabelle\')">Tabelle</button>';
            if (kiBereit()) tabs += '<button class="tab-btn' + (state.adminTab === 'pruefen' ? ' active' : '') + '" onclick="changeAdminTab(\'pruefen\')">🔍 Prüfen</button>';
            tabs += '<button class="tab-btn' + (state.adminTab === 'ki' ? ' active' : '') + '" onclick="changeAdminTab(\'ki\')">🤖 KI</button>';
            tabs += '<button class="tab-btn' + (state.adminTab === 'uebersetzen' ? ' active' : '') + '" onclick="changeAdminTab(\'uebersetzen\')">📖 Übersetzen</button>';
            tabs += '<button class="tab-btn' + (state.adminTab === 'export' ? ' active' : '') + '" onclick="changeAdminTab(\'export\')">Export</button>';
            tabs += '<button class="tab-btn" onclick="handleLogout()" style="margin-left:auto;">🔒 Abmelden</button>';
            tabs += '</div>';
            if (state.adminTab === 'freigaben') return tabs + renderFreigaben(pendingCount);
            if (state.adminTab === 'tabelle') return tabs + renderAdminTable();
            if (state.adminTab === 'pruefen' && !kiBereit()) state.adminTab = 'ki';   // Prüfen braucht die KI
            if (state.adminTab === 'pruefen') return tabs + renderPruefen();
            if (state.adminTab === 'ki') return tabs + renderKI();
            if (state.adminTab === 'werkstatt') { state.adminTab = 'uebersetzen'; }   // alte Werkstatt → Übersetzen
            if (state.adminTab === 'uebersetzen') return tabs + renderUebersetzen();
            return tabs + renderExportTab();
        }
        
        function renderFreigaben(count) {
            var html = '<h2 style="margin-bottom:15px;">Ausstehend (' + count + ')</h2>';
            if (count > 0) html += '<button class="btn" onclick="approveAllChanges()" style="margin-bottom:15px;">✓ Alle freigeben</button>';
            if (count === 0) return html + '<div class="empty">Keine Änderungen</div>';
            state.pendingChanges.forEach(function(c) {
                html += '<div class="card" style="cursor:default;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">';
                html += '<div><h3 style="margin:0;">' + c.begriff + '</h3><span class="pending-badge" style="margin-left:0;">' + (c.action === 'create' ? 'Neu' : 'Edit') + '</span></div>';
                html += '<div><button class="btn btn-small" onclick="approveChange(' + c.id + ')">✓</button> <button class="btn btn-danger btn-small" onclick="rejectChange(' + c.id + ')">✗</button></div></div>';
                if (c.wortart) html += '<div class="card-row"><span class="card-label">Wortart:</span> ' + c.wortart + '</div>';
                if (c.kategorie) html += '<div class="card-row"><span class="card-label">Kategorie:</span> ' + c.kategorie + '</div>';
                if (c.synonyme) html += '<div class="card-row"><span class="card-label">Synonyme:</span> ' + c.synonyme + '</div>';
                if (c.bedeutung) html += '<div class="card-row"><span class="card-label">Bedeutung:</span> ' + c.bedeutung + '</div>';
                html += '</div>';
            });
            return html;
        }
        
        function renderAdminTable() {
            var totalPages = Math.ceil(state.totalCount / CONFIG.ITEMS_PER_PAGE);
            var html = '<div class="search-box"><input type="text" id="admin-search" class="input" placeholder="Suchen..." value="' + state.filter.mundart + '"><div style="margin-top:8px;font-size:13px;color:var(--text-muted);">' + state.totalCount + ' Einträge</div></div>';
            html += '<div class="admin-table-container"><table class="admin-table"><thead><tr><th style="width:30px;">✗</th><th>Begriff</th><th>Reim</th><th>Wortart</th><th>Synonyme</th><th>Bedeutung</th><th>Kategorie</th></tr></thead><tbody>';
            state.currentPageData.forEach(function(w, i) {
                html += '<tr style="' + (i % 2 === 0 ? 'background:var(--bg-tertiary);' : '') + '">';
                html += '<td><button class="delete-row-btn" onclick="deleteRow(' + w.id + ')">✗</button></td>';
                html += '<td><div contenteditable="true" class="editable-cell" onblur="updateCell(' + w.id + ',\'begriff\',this.textContent.trim())" style="font-weight:600;">' + (w.begriff||'') + '</div></td>';
                html += '<td><div contenteditable="true" class="editable-cell" onblur="updateCell(' + w.id + ',\'reim\',this.textContent.trim())">' + (w.reim||'') + '</div></td>';
                html += '<td><div contenteditable="true" class="editable-cell" onblur="updateCell(' + w.id + ',\'wortart\',this.textContent.trim())">' + (w.wortart||'') + '</div></td>';
                html += '<td><div contenteditable="true" class="editable-cell" onblur="updateCell(' + w.id + ',\'synonyme\',this.textContent.trim())">' + (w.synonyme||'') + '</div></td>';
                html += '<td><div contenteditable="true" class="editable-cell" onblur="updateCell(' + w.id + ',\'bedeutung\',this.textContent.trim())">' + (w.bedeutung||'') + '</div></td>';
                html += '<td><div contenteditable="true" class="editable-cell" onblur="updateCell(' + w.id + ',\'kategorie\',this.textContent.trim())">' + (w.kategorie||'') + '</div></td>';
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            if (totalPages > 1) html += renderPagination(totalPages);
            return html;
        }
        
        function changeAdminTab(tab) { state.adminTab = tab; render(); }
        function updateCell(id, field, value) { var data = {}; data[field] = value || null; supabaseCall('woerter?id=eq.' + id, { method: 'PATCH', body: JSON.stringify(data) }); }
        function deleteRow(id) { if (!confirm('Löschen?')) return; supabaseCall('woerter?id=eq.' + id, { method: 'DELETE' }).then(function() { showToast('Gelöscht', 'success'); return loadPageData(state.currentPage, state.filter); }).then(function() { loadTotalCount(); render(); }); }
        
        function approveChange(id) {
            var c = state.pendingChanges.find(function(x) { return x.id === id; });
            if (!c) return;
            var p = c.action === 'create' 
                ? supabaseCall('woerter', { method: 'POST', body: JSON.stringify({ begriff: c.begriff, reim: c.reim, wortart: c.wortart, kategorie: c.kategorie, synonyme: c.synonyme, bedeutung: c.bedeutung, beispielsatz: c.beispielsatz, bemerkung: c.bemerkung }) })
                : supabaseCall('woerter?id=eq.' + c.wort_id, { method: 'PATCH', body: JSON.stringify({ begriff: c.begriff, reim: c.reim, wortart: c.wortart, kategorie: c.kategorie, synonyme: c.synonyme, bedeutung: c.bedeutung, beispielsatz: c.beispielsatz, bemerkung: c.bemerkung }) });
            p.then(function() { return supabaseCall('pending_changes?id=eq.' + id, { method: 'DELETE' }); }).then(function() { showToast('Freigegeben!', 'success'); return loadData(); });
        }
        
        function rejectChange(id) { if (!confirm('Ablehnen?')) return; supabaseCall('pending_changes?id=eq.' + id, { method: 'DELETE' }).then(function() { showToast('Abgelehnt', 'warning'); return loadPendingChanges(); }).then(render); }
        
        function approveAllChanges() {
            if (!confirm(state.pendingChanges.length + ' freigeben?')) return;
            Promise.all(state.pendingChanges.map(function(c) {
                var p = c.action === 'create'
                    ? supabaseCall('woerter', { method: 'POST', body: JSON.stringify({ begriff: c.begriff, reim: c.reim, wortart: c.wortart, kategorie: c.kategorie, synonyme: c.synonyme, bedeutung: c.bedeutung, beispielsatz: c.beispielsatz, bemerkung: c.bemerkung }) })
                    : supabaseCall('woerter?id=eq.' + c.wort_id, { method: 'PATCH', body: JSON.stringify({ begriff: c.begriff, reim: c.reim, wortart: c.wortart, kategorie: c.kategorie, synonyme: c.synonyme, bedeutung: c.bedeutung, beispielsatz: c.beispielsatz, bemerkung: c.bemerkung }) });
                return p.then(function() { return supabaseCall('pending_changes?id=eq.' + c.id, { method: 'DELETE' }); });
            })).then(function() { showToast('Alle freigegeben!', 'success'); return loadData(); });
        }

        function oeffneSchreibregeln(modus) {
            try {
                var bin = atob(SCHREIBREGELN_PDF_B64);
                var arr = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                var blob = new Blob([arr], { type: 'application/pdf' });
                var url = URL.createObjectURL(blob);
                if (modus === 'download') {
                    var a = document.createElement('a');
                    a.href = url; a.download = 'Schreibregeln-Mundartwoerterbuch.pdf';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    showToast('PDF wird heruntergeladen', 'success');
                } else {
                    window.open(url, '_blank');
                }
                setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
            } catch (e) { showToast('PDF konnte nicht geöffnet werden', 'error'); }
        }

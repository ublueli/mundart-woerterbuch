        /* ═══════════ Konsistenzprüfung des Wörterbuchs ═══════════ */
        function konsistenzPruefen() {
            var out = document.getElementById('konsi-out');
            if (out) out.innerHTML = '<div class="loading" style="padding:14px;"><div class="spinner"></div></div>';
            var alle = [], pageSize = 1000, offset = 0;
            function batch() {
                return supabaseCall('woerter?select=id,begriff,beispielsatz&limit=' + pageSize + '&offset=' + offset).then(function(d) {
                    if (d && d.length) { alle = alle.concat(d); offset += pageSize; if (d.length === pageSize) return batch(); }
                    return alle;
                });
            }
            batch().then(function(rows) {
                var treffer = [];
                rows.forEach(function(r) {
                    ['begriff','beispielsatz'].forEach(function(feld) {
                        var v = r[feld]; if (!v) return;
                        String(v).split(/[^A-Za-zÄÖÜäöüßé'’´`-]+/).forEach(function(w) {
                            if (!w || w.length < 2) return;
                            var f = regelPruefeWort(w);
                            f.forEach(function(x) {
                                if (x.art === 'hinweis') return;   // zu viele Fehlalarme
                                treffer.push({ id: r.id, begriff: r.begriff, feld: feld, wort: w, regel: x.regel, vorschlag: x.vorschlag });
                            });
                        });
                    });
                });
                if (!out) return;
                if (!treffer.length) { out.innerHTML = '<p style="color:#2f7d32;">✓ Keine Regelverstösse gefunden (' + rows.length + ' Einträge geprüft).</p>'; return; }
                var h = '<p><b>' + treffer.length + ' Fundstellen</b> in ' + rows.length + ' Einträgen:</p><div class="wz-liste">';
                treffer.slice(0, 300).forEach(function(t) {
                    h += '<div class="wz-item"><span class="wz-item-w">' + escHtml(t.wort) + '</span>'
                       + '<span class="wz-badge wz-b-f">' + escHtml(t.regel) + '</span>'
                       + '<span class="wz-item-m">in «' + escHtml(t.begriff) + '» (' + t.feld + ')'
                       + (t.vorschlag ? ' → <b>' + escHtml(t.vorschlag) + '</b>' : '') + '</span>'
                       + '<button class="wz-mini grau" onclick="showWordDetailById(' + t.id + ')">öffnen</button></div>';
                });
                h += '</div>';
                if (treffer.length > 300) h += '<p class="wz-muted">… weitere ' + (treffer.length - 300) + ' ausgeblendet.</p>';
                out.innerHTML = h;
            }).catch(function(e) { if (out) out.innerHTML = '<p style="color:#c62828;">Fehler: ' + escHtml(e.message) + '</p>'; });
        }

        // Admin
        function renderAdmin() {
            var pendingCount = state.pendingChanges.length;
            var tabs = '<div class="tabs">';
            tabs += '<button class="tab-btn' + (state.adminTab === 'freigaben' ? ' active' : '') + '" onclick="changeAdminTab(\'freigaben\')">Freigaben' + (pendingCount > 0 ? '<span class="pending-badge">' + pendingCount + '</span>' : '') + '</button>';
            tabs += '<button class="tab-btn' + (state.adminTab === 'tabelle' ? ' active' : '') + '" onclick="changeAdminTab(\'tabelle\')">Tabelle</button>';
            tabs += '<button class="tab-btn' + (state.adminTab === 'pruefen' ? ' active' : '') + '" onclick="changeAdminTab(\'pruefen\')">🔍 Prüfen</button>';
            tabs += '<button class="tab-btn' + (state.adminTab === 'ki' ? ' active' : '') + '" onclick="changeAdminTab(\'ki\')">🤖 KI</button>';
            tabs += '<button class="tab-btn' + (state.adminTab === 'werkstatt' ? ' active' : '') + '" onclick="changeAdminTab(\'werkstatt\')">🔧 Werkstatt</button>';
            tabs += '<button class="tab-btn' + (state.adminTab === 'export' ? ' active' : '') + '" onclick="changeAdminTab(\'export\')">Export</button>';
            tabs += '<button class="tab-btn" onclick="handleLogout()" style="margin-left:auto;">🔒 Abmelden</button>';
            tabs += '</div>';
            if (state.adminTab === 'freigaben') return tabs + renderFreigaben(pendingCount);
            if (state.adminTab === 'tabelle') return tabs + renderAdminTable();
            if (state.adminTab === 'pruefen') return tabs + renderPruefen();
            if (state.adminTab === 'ki') return tabs + renderKI();
            if (state.adminTab === 'werkstatt') return tabs + renderWerkstatt();
            return tabs + renderExportTab();
        }
        
        function renderFreigaben(count) {
            var html = '<h2 style="margin-bottom:15px;">Ausstehend (' + count + ')</h2>';
            if (count > 0) html += '<button class="btn" onclick="approveAllChanges()" style="margin-bottom:15px;">✓ Alle freigeben</button>';
            if (count === 0) return html + '<div class="empty">Keine Änderungen</div>';
            state.pendingChanges.forEach(function(c) {
                html += '<div class="card" style="cursor:default;"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">';
                html += '<div><h3 style="margin:0;">' + c.begriff + '</h3><span class="pending-badge" style="margin-left:0;">' + (c.action === 'create' ? 'Neu' : 'Edit') + '</span></div>';
                html += '<div><button class="btn btn-small" onclick="approveChange(' + c.id + ')">✓</button> <button class="btn btn-danger btn-small" onclick="rejectChange(' + c.id + ')">✗</button></div></div>';
                if (c.wortart) html += '<div class="card-row"><span class="card-label">Wortart:</span> ' + c.wortart + '</div>';
                if (c.kategorie) html += '<div class="card-row"><span class="card-label">Kategorie:</span> ' + c.kategorie + '</div>';
                if (c.synonyme) html += '<div class="card-row"><span class="card-label">Synonyme:</span> ' + c.synonyme + '</div>';
                if (c.bedeutung) html += '<div class="card-row"><span class="card-label">Bedeutung:</span> ' + c.bedeutung + '</div>';
                html += '</div>';
            });
            return html;
        }
        
        function renderAdminTable() {
            var totalPages = Math.ceil(state.totalCount / CONFIG.ITEMS_PER_PAGE);
            var html = '<div class="search-box"><input type="text" id="admin-search" class="input" placeholder="Suchen..." value="' + state.filter.mundart + '"><div style="margin-top:8px;font-size:13px;color:var(--text-muted);">' + state.totalCount + ' Einträge</div></div>';
            html += '<div class="admin-table-container"><table class="admin-table"><thead><tr><th style="width:30px;">✗</th><th>Begriff</th><th>Reim</th><th>Wortart</th><th>Synonyme</th><th>Bedeutung</th><th>Kategorie</th></tr></thead><tbody>';
            state.currentPageData.forEach(function(w, i) {
                html += '<tr style="' + (i % 2 === 0 ? 'background:var(--bg-tertiary);' : '') + '">';
                html += '<td><button class="delete-row-btn" onclick="deleteRow(' + w.id + ')">✗</button></td>';
                html += '<td><div contenteditable="true" class="editable-cell" onblur="updateCell(' + w.id + ',\'begriff\',this.textContent.trim())" style="font-weight:600;">' + (w.begriff||'') + '</div></td>';

                html += '<td><div contenteditable="true" class="editable-cell" onblur="updateCell(' + w.id + ',\'wortart\',this.textContent.trim())">' + (w.wortart||'') + '</div></td>';
                html += '<td><div contenteditable="true" class="editable-cell" onblur="updateCell(' + w.id + ',\'synonyme\',this.textContent.trim())">' + (w.synonyme||'') + '</div></td>';
                html += '<td><div contenteditable="true" class="editable-cell" onblur="updateCell(' + w.id + ',\'bedeutung\',this.textContent.trim())">' + (w.bedeutung||'') + '</div></td>';

                html += '</tr>';
            });
            html += '</tbody></table></div>';
            if (totalPages > 1) html += renderPagination(totalPages);
            return html;
        }
        
        function changeAdminTab(tab) { state.adminTab = tab; render(); }
        function updateCell(id, field, value) { var data = {}; data[field] = value || null; supabaseCall('woerter?id=eq.' + id, { method: 'PATCH', body: JSON.stringify(data) }); }
        function deleteRow(id) { if (!confirm('Löschen?')) return; supabaseCall('woerter?id=eq.' + id, { method: 'DELETE' }).then(function() { showToast('Gelöscht', 'success'); return loadPageData(state.currentPage, state.filter); }).then(function() { loadTotalCount(); render(); }); }
        
        function approveChange(id) {
            var c = state.pendingChanges.find(function(x) { return x.id === id; });
            if (!c) return;
            var p = c.action === 'create' 
                ? supabaseCall('woerter', { method: 'POST', body: JSON.stringify({ begriff: c.begriff, reim: c.reim, wortart: c.wortart, kategorie: c.kategorie, synonyme: c.synonyme, bedeutung: c.bedeutung, beispielsatz: c.beispielsatz, bemerkung: c.bemerkung }) })
                : supabaseCall('woerter?id=eq.' + c.wort_id, { method: 'PATCH', body: JSON.stringify({ begriff: c.begriff, reim: c.reim, wortart: c.wortart, kategorie: c.kategorie, synonyme: c.synonyme, bedeutung: c.bedeutung, beispielsatz: c.beispielsatz, bemerkung: c.bemerkung }) });
            p.then(function() { return supabaseCall('pending_changes?id=eq.' + id, { method: 'DELETE' }); }).then(function() { showToast('Freigegeben!', 'success'); return loadData(); });
        }
        
        function rejectChange(id) { if (!confirm('Ablehnen?')) return; supabaseCall('pending_changes?id=eq.' + id, { method: 'DELETE' }).then(function() { showToast('Abgelehnt', 'warning'); return loadPendingChanges(); }).then(render); }
        
        function approveAllChanges() {
            if (!confirm(state.pendingChanges.length + ' freigeben?')) return;
            Promise.all(state.pendingChanges.map(function(c) {
                var p = c.action === 'create'
                    ? supabaseCall('woerter', { method: 'POST', body: JSON.stringify({ begriff: c.begriff, reim: c.reim, wortart: c.wortart, kategorie: c.kategorie, synonyme: c.synonyme, bedeutung: c.bedeutung, beispielsatz: c.beispielsatz, bemerkung: c.bemerkung }) })
                    : supabaseCall('woerter?id=eq.' + c.wort_id, { method: 'PATCH', body: JSON.stringify({ begriff: c.begriff, reim: c.reim, wortart: c.wortart, kategorie: c.kategorie, synonyme: c.synonyme, bedeutung: c.bedeutung, beispielsatz: c.beispielsatz, bemerkung: c.bemerkung }) });
                return p.then(function() { return supabaseCall('pending_changes?id=eq.' + c.id, { method: 'DELETE' }); });
            })).then(function() { showToast('Alle freigegeben!', 'success'); return loadData(); });
        }

        function oeffneSchreibregeln(modus) {
            try {
                var bin = atob(SCHREIBREGELN_PDF_B64);
                var arr = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                var blob = new Blob([arr], { type: 'application/pdf' });
                var url = URL.createObjectURL(blob);
                if (modus === 'download') {
                    var a = document.createElement('a');
                    a.href = url; a.download = 'Schreibregeln-Mundartwoerterbuch.pdf';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    showToast('PDF wird heruntergeladen', 'success');
                } else {
                    window.open(url, '_blank');
                }
                setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
            } catch (e) { showToast('PDF konnte nicht geöffnet werden', 'error'); }
        }

        function renderInfo() {
    return '<div class="info-content">' +
        '<h2>Über dieses Wörterbuch</h2>' +
        '<p>Dieses Mundart-Wörterbuch ist aus meiner über <strong>dreissigjährigen Übersetzertätigkeit</strong> von Theaterstücken in die Schweizer Mundart entstanden. Was als persönliche Wortsammlung begann, ist über die Jahre zu einem umfangreichen Nachschlagewerk gewachsen.</p>' +
        '<p>👉 <a href="https://ueliblum.ch/mundartuebersetzungen/" target="_blank" style="color: var(--accent-color);">Mehr zu meinen Mundartübersetzungen</a></p>' +
        
        '<h2>Schreibweise: Lesbar, nicht phonetisch</h2>' +
        '<p>Die Schreibweise orientiert sich an der <strong>Lesbarkeit und Verständlichkeit</strong> – nicht an der Aussprache einer bestimmten Region.</p>' +
        '<p><strong>Beispiel:</strong> Ich schreibe <strong>«Milch»</strong> und nicht «Miuch» oder «Möuch».</p>' +
        '<p>So kann jede Region das Wort tendenziell nach ihrer eigenen Aussprache lesen:</p>' +
        '<ul style="margin: 10px 0 10px 20px; color: var(--text-secondary);">' +
        '<li>Nidwalden liest es als «Miuch»</li>' +
        '<li>Luzern liest es als «Möuch»</li>' +
        '<li>Bern liest es als «Milch»</li>' +
        '</ul>' +
        '<p>Die Schreibweise ist ein <strong>gemeinsamer Nenner</strong>, der allen Dialekten möglichst gerecht wird.</p>' +
        '<p><strong>Fremdwörter:</strong> Bei Wörtern aus dem Französischen oder Englischen wurde die Schreibweise des Originals in der Regel beibehalten (z.B. Trottoir, Computer).</p>' +
        
        '<h2>Schreibregeln</h2>' +
        '<p>Die vollständigen Schreibregeln dieses Wörterbuchs – Vokale, st/sp, Verbendungen, Pronomen – sind in einem Merkblatt zusammengefasst.</p>' +
        '<p style="margin-top:12px;">' +
        '<button class="btn" onclick="oeffneSchreibregeln(&quot;open&quot;)">📄 Schreibregeln ansehen</button> ' +
        '<button class="btn" style="background:var(--bg-tertiary);color:var(--text-primary);" onclick="oeffneSchreibregeln(&quot;download&quot;)">⬇️ Als PDF speichern</button>' +
        '</p>' +

        '<h2>Ein praktisches Werkzeug</h2>' +
        '<p>Dieses Wörterbuch ist <strong>kein wissenschaftliches Nachschlagewerk</strong> mit phonetischer Lautschrift und sprachwissenschaftlichen Analysen. Es ist ein <strong>praktisches Werkzeug</strong> für alle, die Mundart schreiben – sei es für Theater, Geschichten, Lieder oder den Alltag.</p>' +
        
        '<h2>Mitmachen</h2>' +
        '<p>Du kennst ein Wort, das hier fehlt? Oder hast du eine Ergänzung? Unter <strong>«Mithelfen»</strong> kannst du neue Begriffe vorschlagen oder bestehende Einträge ergänzen.</p>' +
        '<p><strong>Hinweis:</strong> Alle Vorschläge werden vor der Veröffentlichung geprüft und müssen freigegeben werden. Das hilft, die Qualität des Wörterbuchs zu sichern.</p>' +
        
        '<h2>Kontakt</h2>' +
        '<p>Fragen, Anregungen oder Feedback?<br>📧 info [at] ueliblum [punkt] ch</p>' +
        '</div>';
}
        
        function renderLogin() {
            return '<div class="login-box"><h2>Admin-Anmeldung</h2><form onsubmit="handleLogin(event);return false;">'
                 + '<input type="email" name="email" class="input" placeholder="E-Mail" autocomplete="username" required>'
                 + '<input type="password" name="password" class="input" style="margin-top:10px;" placeholder="Passwort" autocomplete="current-password" required>'
                 + '<button type="submit" class="btn" style="width:100%;margin-top:12px;">Anmelden</button>'
                 + '</form></div>';
        }

        function handleLogin(event) {
            event.preventDefault();
            var email = event.target.email.value.trim();
            var password = event.target.password.value;
            showToast('Anmeldung läuft...', 'warning');
            fetch(CONFIG.SUPABASE_URL + '/auth/v1/token?grant_type=password', {
                method: 'POST',
                headers: { 'apikey': CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            }).then(function(res) {
                return res.json().then(function(body) { return { ok: res.ok, body: body }; });
            }).then(function(r) {
                if (r.ok && r.body.access_token) {
                    state.accessToken = r.body.access_token;
                    state.isAdmin = true;
                    changeView('admin');
                    showToast('Angemeldet als ' + email, 'success');
                } else {
                    showToast('Anmeldung fehlgeschlagen', 'error');
                }
            }).catch(function() { showToast('Verbindungsfehler', 'error'); });
        }

        function handleLogout() {
            state.accessToken = null;
            state.isAdmin = false;
            changeView('woerterbuch');
            showToast('Abgemeldet', 'success');
        }
        
        var debouncedSearch = debounce(function() { state.currentPage = 1; state.filter.buchstabe = ''; loadPageData(1, state.filter).then(render); }, CONFIG.DEBOUNCE_DELAY);
        var debouncedReimSearch = debounce(doReimSearch, CONFIG.DEBOUNCE_DELAY);
        var debouncedThesaurusSearch = debounce(doThesaurusSearch, CONFIG.DEBOUNCE_DELAY);
        
        function attachEventListeners() {
            var el;
            el = document.getElementById('search-mundart');
            if (el) { el.addEventListener('input', function(e) { state.filter.mundart = e.target.value; debouncedSearch(); }); el.addEventListener('keypress', function(e) { if (e.key === 'Enter') { state.currentPage = 1; loadPageData(1, state.filter).then(render); }}); }
            el = document.getElementById('search-deutsch');
            if (el) el.addEventListener('input', function(e) { state.filter.deutsch = e.target.value; debouncedSearch(); });
            el = document.getElementById('search-volltext');
            if (el) el.addEventListener('change', function(e) { state.filter.volltext = e.target.checked; state.currentPage = 1; if (state.filter.mundart && state.filter.mundart.trim()) loadPageData(1, state.filter).then(render); });
            el = document.getElementById('search-reim');
            if (el) { el.addEventListener('input', function(e) { state.filter.reim = e.target.value; debouncedReimSearch(); }); el.addEventListener('keypress', function(e) { if (e.key === 'Enter') doReimSearch(); }); }
            el = document.getElementById('search-thesaurus');
            if (el) { el.addEventListener('input', function(e) { state.filter.thesaurus = e.target.value; debouncedThesaurusSearch(); }); el.addEventListener('keypress', function(e) { if (e.key === 'Enter') doThesaurusSearch(); }); }
            el = document.getElementById('admin-search');
            if (el) el.addEventListener('input', function(e) { state.filter.mundart = e.target.value; debouncedSearch(); });
            el = document.getElementById('search-edit-begriff');
            if (el) el.addEventListener('keypress', function(e) { if (e.key === 'Enter') searchBegriffToEdit(); });
            // Werkzeuge
            el = document.getElementById('pruef-ta');
            if (el) el.addEventListener('input', function(e) { state.pruefText = e.target.value; });
            el = document.getElementById('pruef-regie');
            if (el) el.addEventListener('change', function(e) { state.pruefRegie = e.target.checked; });
            el = document.getElementById('ki-text');
            if (el) el.addEventListener('input', function(e) { state.pruefKiText = e.target.value; });
            el = document.getElementById('wk-ziel');
            if (el) el.addEventListener('input', function(e) { state.wkZiel = e.target.value; });
            el = document.getElementById('wk-quelle-ta');
            if (el) el.addEventListener('input', function(e) { state.wkQuelle = e.target.value; });
            el = document.getElementById('wk-sprache');
            if (el) el.addEventListener('change', function(e) { state.wkSprache = e.target.value; });
        }
        
        function render() {
            var content = document.getElementById('content');
            var views = { woerterbuch: renderWoerterbuch, reimlexikon: renderReimlexikon, thesaurus: renderThesaurus, bearbeiten: renderBearbeiten, info: renderInfo, login: renderLogin, admin: renderAdmin };
            content.innerHTML = (views[state.currentView] || function() { return '<div class="empty">?</div>'; })();
            attachEventListeners();
        }
        
        function initNav() {
            document.getElementById('mainNav').innerHTML = [
                { id: 'woerterbuch', label: 'Wörterbuch' },
                { id: 'reimlexikon', label: 'Reimlexikon' },
                { id: 'thesaurus', label: 'Thesaurus' },
                { id: 'bearbeiten', label: 'Mithelfen' },
                { id: 'info', label: 'Info' },
                { id: 'admin', label: 'Admin' }
            ].map(function(v, i) { return '<button class="nav-btn' + (i === 0 ? ' active' : '') + '" onclick="changeView(\'' + v.id + '\')">' + v.label + '</button>'; }).join('');
        }
        
        function changeView(view) {
            if (view === 'admin' && !state.isAdmin) view = 'login';
            state.currentView = view;
            state.currentPage = 1;
            state.filter.buchstabe = '';
            state.filter.kategorie = '';
            state.filter.wortart = '';
            if (view === 'bearbeiten') { state.isNewEntry = false; state.currentEditWord = null; }
            if (view === 'thesaurus') thesaurusResults = null;
            if (view === 'reimlexikon') reimResults = { rein: [], unrein: [] };
            document.querySelectorAll('.nav-btn').forEach(function(btn) {
                var match = btn.getAttribute('onclick').match(/'(.+?)'/);
                btn.classList.toggle('active', match && (match[1] === view || (view === 'login' && match[1] === 'admin')));
            });
            if (view === 'woerterbuch' || view === 'admin') loadPageData(1, state.filter).then(render);
            else render();
        }
        
        function init() { loadTheme(); initNav(); loadData(); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
